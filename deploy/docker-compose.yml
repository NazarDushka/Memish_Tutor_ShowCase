services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=MemeEnglishBotDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__AdminChatId=${AdminChatId}
      - Llm__ApiKey=${LLM_API_KEY}
      - Delivery__CheckIntervalMinutes=60
    depends_on:
      - db
    networks:
      - internal

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  sql_data:
  caddy_data: